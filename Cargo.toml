[package]
name = "ironmark"
version = "0.1.0"
edition = "2021"
description = "Lightweight, fast, secure, read-only Markdown & Mermaid viewer"
license = "MIT"
repository = "https://github.com/kevinfra/ironmark"
readme = "README.md"
keywords = ["markdown", "mermaid", "viewer", "webview", "offline"]
categories = ["command-line-utilities", "gui", "text-processing"]

[dependencies]
tao = "0.34"
wry = "0.53"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
ammonia = "4"
flate2 = "1"
notify = "8"
rfd = "0.15"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
